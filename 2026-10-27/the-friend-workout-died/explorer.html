<!DOCTYPE html><html><head><meta charset="utf-8"><title>Your Workout, In Company?</title>
<style>body{font-family:Georgia,serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}h1{font-size:26px}select{font-size:16px;padding:4px}.card{background:#f7f3ee;border:1px solid #ddd;border-radius:8px;padding:16px;margin-top:16px}b.n{font-size:22px;color:#c0392b}</style></head>
<body><h1>Your workout, in company?</h1>
<p>Pick your main workout and your age band. The numbers are from 258,954 American time diaries (ATUS 2003-2025), weighted to the U.S. population: how people like you actually exercised in 2021-25, and how that looked in 2003-07.</p>
<label>Workout <select id="act"></select></label>
<label>Age <select id="age"></select></label>
<div class="card" id="out"></div>
<script>const D={"acts": [{"label": "Walking", "alone_now": 52.7, "alone_then": 53.2, "dur_alone": 43, "dur_social": 53, "friend": 7.6}, {"label": "Working out, unspec.", "alone_now": 76.2, "alone_then": 69.6, "dur_alone": 47, "dur_social": 55, "friend": 7.0}, {"label": "Weightlifting", "alone_now": 67.0, "alone_then": 64.6, "dur_alone": 51, "dur_social": 60, "friend": 9.7}, {"label": "Water sports", "alone_now": 16.3, "alone_then": 14.7, "dur_alone": 62, "dur_social": 109, "friend": 20.0}, {"label": "Cardio equipment", "alone_now": 81.6, "alone_then": 75.5, "dur_alone": 38, "dur_social": 38, "friend": 5.2}, {"label": "Running", "alone_now": 75.6, "alone_then": 70.3, "dur_alone": 47, "dur_social": 57, "friend": 11.0}, {"label": "Biking", "alone_now": 64.2, "alone_then": 49.7, "dur_alone": 59, "dur_social": 77, "friend": 12.1}, {"label": "Yoga", "alone_now": 59.4, "alone_then": 64.9, "dur_alone": 44, "dur_social": 62, "friend": 9.4}, {"label": "Aerobics", "alone_now": 48.8, "alone_then": 59.4, "dur_alone": 44, "dur_social": 61, "friend": 9.9}, {"label": "Hiking", "alone_now": 26.9, "alone_then": 22.5, "dur_alone": 121, "dur_social": 123, "friend": 27.3}, {"label": "Dancing", "alone_now": 14.4, "alone_then": 5.9, "dur_alone": 73, "dur_social": 118, "friend": 48.5}, {"label": "Ski/skate/snowboard", "alone_now": 25.1, "alone_then": 16.4, "dur_alone": 175, "dur_social": 151, "friend": 25.3}], "ages": {"15-24": {"2003-07": {"alone": 33.8, "friend": 28.6}, "2021-25": {"alone": 49.0, "friend": 16.9}}, "25-34": {"2003-07": {"alone": 47.6, "friend": 10.0}, "2021-25": {"alone": 53.7, "friend": 8.8}}, "35-44": {"2003-07": {"alone": 49.5, "friend": 8.3}, "2021-25": {"alone": 51.7, "friend": 4.9}}, "45-54": {"2003-07": {"alone": 59.6, "friend": 6.6}, "2021-25": {"alone": 57.5, "friend": 4.2}}, "55-64": {"2003-07": {"alone": 61.4, "friend": 7.3}, "2021-25": {"alone": 61.5, "friend": 3.7}}, "65+": {"2003-07": {"alone": 63.0, "friend": 8.4}, "2021-25": {"alone": 63.3, "friend": 4.3}}}};
const A=document.getElementById('act'),G=document.getElementById('age'),O=document.getElementById('out');
D.acts.forEach((a,i)=>A.add(new Option(a.label,i)));
Object.keys(D.ages).forEach(a=>G.add(new Option(a,a)));
function go(){const a=D.acts[A.value],g=D.ages[G.value];
O.innerHTML=`<p><b class="n">${a.alone_now}%</b> of ${a.label.toLowerCase()} minutes are now done alone`+(a.alone_then?` (was ${a.alone_then}% in 2003-07)`:"")+`.</p>
<p>At your age, <b class="n">${g['2021-25'].alone}%</b> of all exercise minutes are solo (was ${g['2003-07'].alone}%), and just ${g['2021-25'].friend}% happen with friends (was ${g['2003-07'].friend}%).</p>
<p>When people do ${a.label.toLowerCase()} alone it lasts about <b>${a.dur_alone} min</b>. With company: <b>${a.dur_social} min</b>. Company is the cheapest performance enhancer in the data.</p>`;}
A.onchange=go;G.onchange=go;go();</script></body></html>
